<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- "Onda en vidrio": the Onda mark (five voice bars that draw an M) on a dark glass tile.
       Used for the favicon and the large .ico sizes; sizes <= 32px use icon-small.svg. -->
  <defs>
    <clipPath id="tile">
      <rect x="64" y="64" width="896" height="896" rx="210"/>
    </clipPath>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.38"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.75" fx="0.5" fy="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bars" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9C9CF"/>
    </linearGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2"/>
      <feOffset dy="1.8" result="blur"/>
      <feFlood flood-color="#000000" flood-opacity="0.55"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#tile)">
    <rect x="64" y="64" width="896" height="896" fill="#141416"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#glass)"/>
    <rect x="64" y="64" width="896" height="600" fill="url(#sheen)"/>
    <rect x="64" y="64" width="896" height="896" fill="url(#shade)"/>
  </g>
  <rect x="68" y="68" width="888" height="888" rx="206" fill="none" stroke="url(#rim)" stroke-width="8"/>

  <g transform="translate(234 234) scale(5.56)" filter="url(#lift)" fill="url(#bars)">
    <rect x="13" y="20" width="10" height="60" rx="5"/>
    <rect x="29" y="32" width="10" height="36" rx="5"/>
    <rect x="45" y="24" width="10" height="52" rx="5"/>
    <rect x="61" y="32" width="10" height="36" rx="5"/>
    <rect x="77" y="20" width="10" height="60" rx="5"/>
  </g>
</svg>
