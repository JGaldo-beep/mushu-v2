<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Small-size variant of mini-logo.svg (16-32px .ico entries and the tray icon): the
       glass highlights would only blur into mud at that size, so it is a flat dark tile
       with a light rim, keeping the mark readable on both light and dark taskbars. -->
  <rect x="40" y="40" width="944" height="944" rx="220" fill="#17171A" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="28"/>
  <g transform="translate(167 167) scale(6.9)" fill="#F4F4F5">
    <rect x="13" y="20" width="10" height="60" rx="5"/>
    <rect x="29" y="32" width="10" height="36" rx="5"/>
    <rect x="45" y="24" width="10" height="52" rx="5"/>
    <rect x="61" y="32" width="10" height="36" rx="5"/>
    <rect x="77" y="20" width="10" height="60" rx="5"/>
  </g>
</svg>
